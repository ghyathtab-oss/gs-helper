<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>أرشيف المرضى – GS Helper</title>
  <meta name="description" content="أرشيف المرضى: إضافة، بحث، حذف، وتحميل الأرشيف." />
  <meta name="theme-color" content="#0b1f3a" />
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header id="app-header"></header>
  <main class="container">

    <!-- إضافة مريض -->
    <section class="card">
      <div class="section-title"><span class="bar"></span><span>إضافة مريض جديد</span></div>
      <form id="patientForm" autocomplete="off">
        <label for="name">اسم المريض</label>
        <input type="text" id="name" required />

        <label for="fileNo">رقم الملف</label>
        <input type="text" id="fileNo" required />

        <label for="phone">الهاتف</label>
        <input type="tel" id="phone" />

        <label for="age">العمر</label>
        <input type="number" id="age" min="0" max="130" />

        <label for="complaint">الشكاية</label>
        <textarea id="complaint"></textarea>

        <label for="diagnosis">التشخيص</label>
        <textarea id="diagnosis"></textarea>

        <label for="specialist">الأخصائي</label>
        <input type="text" id="specialist" />

        <label for="date">التاريخ</label>
        <input type="date" id="date" />

        <button class="btn" type="submit" id="saveBtn"></button>
      </form>
    </section>

    <!-- البحث + الأدوات -->
    <section class="card">
      <div class="section-title"><span class="bar"></span><span>البحث في الأرشيف</span></div>
      <div class="search-wrap" id="searchIcon">
        <input type="text" id="searchInput" placeholder="ابحث بالاسم، رقم الملف، التشخيص..." />
      </div>
      <p class="hint" id="countHint"></p>
      <div class="btn-row" style="margin-top:12px;">
        <button class="btn btn-ghost btn-sm" id="exportJsBtn"></button>
        <button class="btn btn-ghost btn-sm" id="downloadBtn"></button>
      </div>

      <div id="patientsList"></div>
      <div class="empty" id="emptyState" style="display:none;">لا يوجد مرضى مطابقون</div>
    </section>
  </main>
  <nav id="bottom-nav"></nav>

  <script src="assets/js/users.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/main.js"></script>
  <script src="data/patients.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/archive.js"></script>
</body>
</html>
